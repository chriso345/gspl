name: CI Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  tests_and_lint:
    name: Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.2'

      - name: Install tools
        run: scripts/tools/install_tools.sh

      - name: Go Build & Vet
        run: |
          go build ./...
          go vet ./...

      - name: Lint
        run: golangci-lint run ./...

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

      - name: Coverage (threshold)
        run: scripts/testing/run_coverage.sh
