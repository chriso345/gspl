name: CI Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      go-home: ${{ steps.setup-go.outputs.go-home }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.2'

      - name: Install tools
        run: scripts/tools/install_tools.sh

  tests:
    name: Tests & Lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go Build & Vet
        run: |
          go build ./...
          go vet ./...

      - name: Lint
        run: golangci-lint run ./...

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

      - name: Coverage (threshold)
        run: scripts/testing/run_coverage.sh

  bindings:
    name: Validate Bindings
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Check Bindings Exports
        run: scripts/bindings/check_bindings_exports.sh
